[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparklm"
version = "0.1.0"
description = "A small language model built from scratch, step by step."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2",
    "pytest>=8.0",
    "tiktoken>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
